services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glue-dispenser-db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_init:
    build:
      context: .
      dockerfile: shared/db_init/Dockerfile
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/glue-dispenser-db

  # vector-aggregator:
  #   image: timberio/vector:latest-alpine  # ✅ Has image
  #   container_name: vector-aggregator
  #   user: root
  #   ports:
  #     - "6000:6000"  # ✅ ADDED - fixes your error
  #   environment:
  #     - DEBUG_HUB=add_hub_timestamp
  #   volumes:
  #     - ./deploy/vector/vector-aggregator-hub.yaml:/etc/vector/vector.yaml:ro
  #     - ./services/log_parser/data:/app/data
  #   restart: unless-stopped
  #   depends_on:
  #     - postgres

  grafana:
    image: grafana/grafana:12.3.2
    container_name: grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    user: "${UID}:${GID}" # run as your host user
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000

volumes:
  postgres_data:
