[project]
name = "glue-dispenser-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.1",
  "mlflow>=2.17.2",
  "pandas>=2.0.3",
  "psycopg2-binary>=2.9.10",
  "pyyaml>=6.0.3",
  "rerun-sdk>=0.22.1",
  "scikit-learn>=1.3.2",
  "sqlalchemy>=2.0.46",
  "statsmodels>=0.14.1",
  "torch>=2.5.1",
  "xgboost>=2.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=3.5.0",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
