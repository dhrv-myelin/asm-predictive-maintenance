# =============================================================================
# analysis_config.yaml — Single source of truth for all inference configs
# =============================================================================
#
# DB     : glue-dispenser-db (TimescaleDB)
# Table  : process_metrics
# Format : long → (timestamp, station_name, metric_name, value, unit, state_context)
#          DataLoader pivots long→wide (one row per cycle) before model pipelines
#
# Metric naming: <station>/<metric>
# target_column : the wide-format column name that is the prediction target
#
# analysis_types: forecast | anomaly | health_score | rul
# forecast_method: mamba
# anomaly_method:  zscore | western_electric | isolation_forest
# =============================================================================

# ALL_AVAILABLE_FEATURES:
# rbw_station__marking_to_image_save_wait
# rbw_station__z_axis_positioning_wait
# rbw_station__pre_camera_positioning_wait
# rbw_station__marking_galvo_positioning_time
# rbw_station__post_homing_wait
# system__m1_position_actual
# rbw_station__z_axis_target_height
# rbw_station__pre_image_save_wait
# rbw_station__gantry_positioning_to_pre_marking_wait
# rbw_station__m2_position_target
# rbw_station__between_cluster_gantry_positioning_wait
# rbw_station__gantry_move_z
# rbw_station__reinspection_time
# rbw_station__gantry_move_m2
# rbw_station__marking_init_time
# rbw_station__double_exposure_positioning_time
# rbw_station__skip_image_save_delay
# rbw_station__z_axis_position_target
# rbw_station__marking_result_wait
# rbw_station__clamping_time
# rbw_station__product_release_wait
# rbw_station__pre_double_exposure_wait_time
# exit_sink__cycle_time
# rbw_station__pre_marking_wait
# exit_sink__throughput_total
# rbw_station__gantry_positioning_time
# rbw_station__camera_positioning_time
# rbw_station__gantry_move_x
# rbw_station__galvo_1_position
# rbw_station__camera_image_save_time
# rbw_station__unclamping_time
# rbw_station__marking_repeat_wait
# system__x_axis_position_actual
# system__x_axis_position_target
# rbw_station__galvo_2_position
# rbw_station__marking_to_reinspection_wait
# rbw_station__gantry_move_m1
# rbw_station__m2_position_actual
# rbw_station__upstream_waiting_time
# rbw_station__pre_data_handshake_wait
# rbw_station__data_handshake_time
# rbw_station__z_axis_positioning_time
# rbw_station__z_axis_homing_time
# system__m1_position_target
# rbw_station__z_axis_position_actual
# timestamp

global:
  db:
    database_url_env: postgresql://postgres:postgres@localhost:5432/glue-dispenser-db
    input_table: process_metrics
    output_table: analysis_results
    schema: public
  mlflow:
    tracking_uri_env: MLFLOW_TRACKING_URI
    artifact_root_env: MLFLOW_ARTIFACT_ROOT

# ---------------------------------------------------------------------------
# Allowed metrics used in stats_model_2.py and baseline_stats.py
# ---------------------------------------------------------------------------
allowed_metrics:
  - clamping_time
  - pre_data_handshake_wait
  - z_axis_positioning_time
  - gantry_positioning_time
  - z_axis_homing_time
  - marking_galvo_positioning_time #for time based galvo data
# ---------------------------------------------------------------------------
# Per-metric configs. Unset fields inherit from global.
# ---------------------------------------------------------------------------
target:
  rbw_machine__health_score:
    #=================================================================================
    - method: isolation_forest
      save_name: rbw_machine__health_score
      model_type: sklearn
      required_features:
        - rbw_station__z_axis_positioning_wait
        - rbw_station__pre_camera_positioning_wait
        - rbw_station__marking_galvo_positioning_time
        - rbw_station__post_homing_wait
        - system__m1_position_actual
        - rbw_station__z_axis_target_height
        - rbw_station__pre_image_save_wait
        - rbw_station__m2_position_target
        - rbw_station__between_cluster_gantry_positioning_wait
        - rbw_station__gantry_move_z
        - rbw_station__reinspection_time
        - rbw_station__gantry_move_m2
        - rbw_station__marking_init_time
        - rbw_station__double_exposure_positioning_time
        - rbw_station__z_axis_position_target
        - rbw_station__marking_result_wait
        - rbw_station__clamping_time
        - rbw_station__product_release_wait
        - rbw_station__pre_double_exposure_wait_time
        - rbw_station__pre_marking_wait
        - rbw_station__gantry_positioning_time
        - rbw_station__camera_positioning_time
        - rbw_station__gantry_move_x
        - rbw_station__galvo_1_position
        - rbw_station__camera_image_save_time
        - rbw_station__unclamping_time
        - rbw_station__marking_repeat_wait
        - system__x_axis_position_actual
        - system__x_axis_position_target
        - rbw_station__galvo_2_position
        - rbw_station__marking_to_reinspection_wait
        - rbw_station__gantry_move_m1
        - rbw_station__m2_position_actual
        - rbw_station__upstream_waiting_time
        - rbw_station__pre_data_handshake_wait
        - rbw_station__data_handshake_time
        - rbw_station__z_axis_positioning_time
        - rbw_station__z_axis_homing_time
        - system__m1_position_target
        - rbw_station__z_axis_position_actual
        - timestamp

      load_path: "saved_models/rbw_machine__health_score/model.joblib"

      history_window: 1
      stride: 1
      prediction_window: 1
      mode: offline

      arch:
        smoothing_window: 5
        n_estimators: 100
        contamination: "auto"
        drift_percentile: 5
        random_state: 42
        breakdown_sensitivity: 3.0

      train_params:
        n_estimators: 300
        max_depth: 6
        learning_rate: 0.05
        train_split: 0.7
        val_split: 0.2
        test_split: 0.1

      analysis_types: [score]
    #=================================================================================

rbw_machine__stats_pattern:
  #=================================================================================
  - method: stats_pattern
    save_name: rbw_machine__stats_pattern
    model_type: stats_pattern
    format: stats
    required_features:
      actuators:
        - clamping_time
        - pre_data_handshake_wait
      servo:
        - z_axis_positioning_time
        - gantry_positioning_time
        - z_axis_homing_time
      galvo:
        - marking_galvo_positioning_time

    STEP_WINDOW: 10
    BASELINE_REF_FRAC: 0.20
    OSC_WINDOW: 50
    OSC_STEP: 5
    OSC_LAG: 3
    TARGET_DETECTOR_WINDOW_S: 3600 # 60 minutes → rolling stat window
    TARGET_ANOMALY_PERSIST_S: 600 # 10 minutes → persistence gate
    TARGET_SHORT_WINDOW_S: 600 # 10 minutes → fast-react window for shift/drift
    # clean.where(z: spike_z) passes every reading through, so shifted values
    SPIKE_Z_CAP: 8.0
    # STEP_SIGMA_MULT_CAP: 4.0
    # STEP_SIGMA_MULT_FLOOR: 2.0
    STEP_SIGMA_MULT_CAP: 2.5 # was 4.0 — only used to calibrate step_sigma_mult
    STEP_SIGMA_MULT_FLOOR: 1.5
    VARIANCE_MULT_MULTIPLIER: 2.0
    VARIANCE_MULT_CAP: 3.0
    VARIANCE_MULT_FLOOR: 1.5
    STABILITY_RATIO_MULTIPLIER: 2.0 # median_roll_std × 2.0 / bs → ratio
    STABILITY_RATIO_FLOOR: 0.6
    STABILITY_RATIO_CAP: 2.0

    # history_window: 1
    # stride: 1
    # prediction_window: 1

    analysis_types: [stats_pattern]
