  panel_height: 8
  columns: 24

features:
  rolling_window:
    enabled: true
    datasource_type: "grafana-postgresql-datasource"
    options:
      - "1 minute"
      - "5 minutes"
      - "10 minutes"
      - "15 minutes"
      - "30 minutes"
      - "1 hour"
    default: "10 minutes"

  annotations:
    enabled: false
    rules:
      - name: "Rule 1 - Beyond 3σ"
        color: "red"
        query: "nelson_rule_1"
      - name: "Rule 2 - Run of 9"
        color: "orange"
        query: "nelson_rule_2"
      - name: "Rule 3 - 6 Trending"
        color: "yellow"
        query: "nelson_rule_3"
