"version": "2.0"
"description": "Auto-generated log parsing patterns"
"patterns":
- "name": "System Reset"
  "regex": "Application initialized\\s*$"
  "event_type": "SYSTEM_RESET"
  "target_id": "Global/System"
- "name": "Entry Stopper Down Start"
  "regex": "^前阻挡顶升气缸电磁阀\\s*[\\[［]OFF[\\]］]$"
  "event_type": "ENTRY_STOPPER_DOWN_START"
  "target_id": "ced_station"
- "name": "Entry Stopper Down Done"
  "regex": "^前阻挡顶升气缸HOME位.*完成"
  "event_type": "ENTRY_STOPPER_DOWN_DONE"
  "target_id": "ced_station"
- "name": "Pallet Arrived"
  "regex": "产品进入\\[到位感应\\]位置完成"
  "event_type": "PALLET_ARRIVED"
  "target_id": "ced_station"
- "name": "Entry Stopper Up Start"
  "regex": "^前阻挡顶升气缸电磁阀\\s*[\\[［]ON[\\]］]$"
  "event_type": "ENTRY_STOPPER_UP_START"
  "target_id": "ced_station"
- "name": "Entry Stopper Up Done"
  "regex": "^前阻挡顶升气缸WORK位.*完成"
  "event_type": "ENTRY_STOPPER_UP_DONE"
  "target_id": "ced_station"
- "name": "Pallet Clamp Start"
  "regex": "^冰鱼顶升气缸电磁阀\\s*[\\[［]ON[\\]］]$"
  "event_type": "PALLET_CLAMP_START"
  "target_id": "ced_station"
- "name": "Pallet Clamp Done"
  "regex": "^冰鱼顶升气缸WORK位.*完成"
  "event_type": "PALLET_CLAMP_DONE"
  "target_id": "ced_station"
- "name": "Pallet Lifting Start"
  "regex": "^中顶升气缸电磁阀\\s*[\\[［]ON[\\]］]$"
  "event_type": "PALLET_LIFTING_START"
  "target_id": "ced_station"
- "name": "Pallet Lifting Done"
  "regex": "^中顶升气缸WORK位.*完成"
  "event_type": "PALLET_LIFTING_DONE"
  "target_id": "ced_station"
- "name": "Scan Start"
  "regex": "^扫码枪开始扫码\\.\\.\\.\\.\\.\\.$"
  "event_type": "SCAN_START"
  "target_id": "ced_station"
- "name": "Scan Done"
  "regex": "^读码结束$"
  "event_type": "SCAN_DONE"
  "target_id": "ced_station"
- "name": "Pdca Conn Ok"
  "regex": "^PDCA连接成功$"
  "event_type": "PDCA_CONN_OK"
  "target_id": "ced_station"
- "name": "Sfc Conn Ok"
  "regex": "^SFC 连接成功$"
  "event_type": "SFC_CONN_OK"
  "target_id": "ced_station"
- "name": "Sfc Query Sent"
  "regex": "给SFC发送:sfc_post@(?P<query>.*)"
  "event_type": "SFC_QUERY_SENT"
  "target_id": "ced_station"
- "name": "Sfc Response Received"
  "regex": "OK:(?P<payload>.*)\\}@"
  "event_type": "SFC_RESPONSE_RECEIVED"
  "target_id": "ced_station"
- "name": "Cavity Move Start"
  "regex": "\\[穴位(?P<idx>\\d+)\\]\\s*开始运动"
  "event_type": "CAVITY_MOVE_START"
  "target_id": "ced_station"
- "name": "Cavity Move Done"
  "regex": "\\[穴位(?P<idx>\\d+)\\]\\s*运动完成"
  "event_type": "CAVITY_MOVE_DONE"
  "target_id": "ced_station"
- "name": "Inspection Move Start"
  "regex": "\\[复检拍照位\\]\\s*开始运动"
  "event_type": "INSPECTION_MOVE_START"
  "target_id": "ced_station"
- "name": "Inspection Move Done"
  "regex": "\\[复检拍照位\\]\\s*运动完成"
  "event_type": "INSPECTION_MOVE_DONE"
  "target_id": "ced_station"
- "name": "Pallet Unclamp Start"
  "regex": "^冰鱼顶升气缸电磁阀\\s*[\\[［]OFF[\\]］]$"
  "event_type": "PALLET_UNCLAMP_START"
  "target_id": "ced_station"
- "name": "Pallet Unclamp Done"
  "regex": "^冰鱼顶升气缸HOME位.*完成"
  "event_type": "PALLET_UNCLAMP_DONE"
  "target_id": "ced_station"
- "name": "Pallet Lowering Start"
  "regex": "^中顶升气缸电磁阀\\s*[\\[［]OFF[\\]］]$"
  "event_type": "PALLET_LOWERING_START"
  "target_id": "ced_station"
- "name": "Pallet Lowering Done"
  "regex": "^中顶升气缸HOME位.*完成"
  "event_type": "PALLET_LOWERING_DONE"
  "target_id": "ced_station"
- "name": "Exit Stopper Down Start"
  "regex": "^后阻挡顶升气缸电磁阀\\s*[\\[［]OFF[\\]］]$"
  "event_type": "EXIT_STOPPER_DOWN_START"
  "target_id": "ced_station"
- "name": "Exit Stopper Down Done"
  "regex": "^后阻挡顶升气缸HOME位.*完成"
  "event_type": "EXIT_STOPPER_DOWN_DONE"
  "target_id": "ced_station"
- "name": "Exit Stopper Up Start"
  "regex": "^后阻挡顶升气缸电磁阀\\s*[\\[［]ON[\\]］]$"
  "event_type": "EXIT_STOPPER_UP_START"
  "target_id": "ced_station"
- "name": "Exit Stopper Up Done"
  "regex": "^后阻挡顶升气缸WORK位.*完成"
  "event_type": "EXIT_STOPPER_UP_DONE"
  "target_id": "ced_station"
