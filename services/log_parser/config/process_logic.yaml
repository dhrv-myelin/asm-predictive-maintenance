version: "1.0"
description: "CED Station Process Logic"

definitions:
  # ==========================================
  # 1. CED STATION
  # ==========================================
  ced_station:
    initial_state: "IDLE"
    states:
      IDLE:
        transitions:
          - event: "PALLET_ARRIVAL"
            next_state: "IDLE"
            metrics:
              - name: "ced_idle_time"
                type: "duration_seconds"
                description: "Time spent in IDLE state"
            transition_stage: "arrival"


  # ==========================================
  # 2. SINK
  # ==========================================

  exit_sink:
    initial_state: "ACTIVE"
    states:
      ACTIVE:
        transitions:
          - event: "PALLET_ARRIVAL"
            next_state: "ACTIVE"
            action: "destroy_pallet"